# =====================
# Font
# =====================
[main]
font=JetBrainsMono NF:size=12:weight=Bold
pad=4x4

# =====================
# Colors
# =====================
[colors-dark]
foreground=BEB598
background=1C1C1C

# Normal colors (0–7)
regular0=1C1C1C   # black
regular1=CF6A6A   # red
regular2=8FB573   # green
regular3=C8A96A   # yellow
regular4=7DA6C1   # blue
regular5=A58ACB   # magenta
regular6=7FB4B8   # cyan
regular7=BEB598   # white

# Bright colors (8–15)
bright0=3A3A3A    # bright black
bright1=E07A7A    # bright red
bright2=A4C98A    # bright green
bright3=DBC07A    # bright yellow
bright4=8FB8D8    # bright blue
bright5=B89FE0    # bright magenta
bright6=93C9CC    # bright cyan
bright7=E6E1C4    # bright white

# Dim colors
dim0=9A8F6A
dim1=A85A5A

# Transparency 
alpha=1.0
