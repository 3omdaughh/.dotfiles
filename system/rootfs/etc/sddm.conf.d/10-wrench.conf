# Wayland greeter running the "wrench" theme.
#
# DisplayServer=wayland is required here: this machine has no Xorg session of
# its own, and the greeter should not start one just to draw a login box.
# CompositorCommand adds --idle-time=0 to SDDM's default so the login screen
# never blanks while it is waiting for a password.

[General]
DisplayServer=wayland
GreeterEnvironment=QT_QUICK_CONTROLS_STYLE=Basic,QT_WAYLAND_DISABLE_WINDOWDECORATION=1,QML_XHR_ALLOW_FILE_READ=1

[Theme]
Current=wrench

[Wayland]
CompositorCommand=weston --shell=kiosk --idle-time=0
