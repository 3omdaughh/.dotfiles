[General]
#
# wrench — theme configuration
# Every value here is read live by Main.qml; edit and log out to apply.
#

# --- assets -----------------------------------------------------------------
background=assets/background.png
grain=assets/grain.png
avatar=assets/avatar.png

# Username the custom avatar belongs to. Any other account falls back to a
# generated monogram, so a second user never wears someone else's face.
avatarUser=omdaughh

# --- typography -------------------------------------------------------------
fontFamily=JetBrainsMono Nerd Font

# --- palette ----------------------------------------------------------------
colorBase=#0a0a0b
colorSurface=#111113
colorField=#0c0c0e
colorBorder=#242428
colorBorderHover=#35353b
colorText=#e4e4e1
colorMuted=#6e6e77
colorDim=#43434a
colorAccent=#d8bf55
colorAccentDim=#7d6e33
colorError=#b5564a

# --- composition ------------------------------------------------------------
backgroundOpacity=0.42
grainOpacity=0.05
panelWidth=352
panelOffsetY=-52

# --- multi-monitor ----------------------------------------------------------
# SDDM draws one greeter window per output. The theme shows the login form on
# the primary screen only; every other screen gets the wallpaper and nothing
# else. Set loginOutput to an output name (e.g. eDP-1) to override which head
# gets the form.
#
# Pinned to the built-in panel. With an external monitor attached at boot,
# Qt reported the *external* head as primary, so the form appeared there and
# the laptop showed only wallpaper. An output name that is not connected is
# ignored and the primary screen is used, so unplugging is safe.
#
# Output names come from the greeter log: `journalctl -b -u sddm | grep
# 'Adding view'`.
loginOutput=eDP-1

# --- system info ------------------------------------------------------------
# Read from /proc and /etc at runtime; these are only used if that read fails.
fallbackHost=Mind
fallbackKernel=Linux 7.1.11-arch1-1
arch=x86_64
